version: 2.1

orbs:
  docker: circleci/docker@2.4.0
  python: circleci/python@2.1.1

executors:
  python-docker:
    docker:
      - image: cimg/python:3.9

jobs:
  lint-and-test:
    executor: python-docker
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          packages:
            - flake8
            - pytest
            - black
      - run:
          name: Run linting
          command: |
            flake8 .
            black . --check
      - run:
          name: Run tests
          command: |
            pytest tests/

  build-and-push:
    executor: python-docker
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - docker/build:
          image: $DOCKER_IMAGE
          tag: $CIRCLE_SHA1
      - docker/push:
          image: $DOCKER_IMAGE
          tag: $CIRCLE_SHA1
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - docker/push:
                image: $DOCKER_IMAGE
                tag: latest

  deploy-staging:
    executor: python-docker
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Deploy to staging
          command: |
            echo "Deploy to staging environment"
            # Add deployment scripts here

  deploy-production:
    executor: python-docker
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Deploy to production
          command: |
            echo "Deploy to production environment"
            # Add deployment scripts here

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - lint-and-test
      - build-and-push:
          requires:
            - lint-and-test
          context:
            - docker-hub-creds
          filters:
            branches:
              only:
                - main
                - develop
      - deploy-staging:
          requires:
            - build-and-push
          filters:
            branches:
              only: develop
      - deploy-production:
          requires:
            - build-and-push
          filters:
            branches:
              only: main
